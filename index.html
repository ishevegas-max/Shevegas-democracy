<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#ff7a2f" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="SheVegas" />
  <meta name="application-name" content="SheVegas" />
  <title>SheVegas</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
  <link rel="stylesheet" href="play.css" />
</head>
<body>
  <main id="stage">
    <picture>
      <source media="(orientation: landscape)" srcset="art/splash-full.png" />
      <img class="bleed" src="art/splash.png" alt="" />
    </picture>
    <h1 class="mark">SHEVEGAS</h1>
    <p id="line" class="line">THIS IS SHEBOYGAN COUNTY</p>

    <div id="board" class="board" hidden>
      <svg class="geo" viewBox="0 0 100 140" preserveAspectRatio="none" aria-hidden="true">
        <path class="lake-fill" d="M82,0 L100,0 L100,140 L80,140 C86,112 78,90 82,68 C86,46 78,20 82,0 Z" />
        <path class="beach-fill" d="M80,0 C77,20 85,46 80,68 C75,90 87,112 78,140 L75,140 C84,112 72,90 77,68 C82,46 74,20 77,0 Z" />
        <path class="river-stroke" d="M48,84 C58,80 66,72 74,70 C80,68 82,66 84,74" />
        <path class="path-stroke" d="M86,14 C90,32 84,48 88,62 C92,78 86,100 90,128" />
        <path class="road-stroke" d="M4,50 C18,46 30,44 44,42 C54,40 60,44 66,48" />
        <path class="road-stroke" d="M62,70 C60,82 56,92 48,104" />
      </svg>
      <div class="eighth" aria-hidden="true"></div>
      <div class="blocks b-north" aria-hidden="true"></div>
      <div class="blocks b-down" aria-hidden="true"></div>
      <div class="blocks b-south" aria-hidden="true"></div>
      <div class="tree t1" aria-hidden="true"></div>
      <div class="tree t2" aria-hidden="true"></div>
      <div class="tree t3" aria-hidden="true"></div>
      <div class="tree t4" aria-hidden="true"></div>
      <div class="tree t5" aria-hidden="true"></div>
      <div class="tree t6" aria-hidden="true"></div>
      <div class="boat" aria-hidden="true"></div>
      <div class="bench" aria-hidden="true"></div>
      <p class="geo-label county-name">SHEBOYGAN COUNTY</p>
      <p class="geo-label lake-name">LAKE MICHIGAN</p>
      <p class="geo-label river-name">RIVER</p>
      <p class="geo-label street-name">8TH ST</p>
      <button id="kt-county" class="geo-label kt-county" type="button">COUNTY KWIK TRIP</button>
      <button id="lighthouse" class="lighthouse" type="button" data-go="light" aria-label="Lighthouse">
        <span class="lamp"></span>
      </button>
      <div id="places" class="places"></div>
      <div id="pawn" class="pawn" hidden>★</div>
      <div id="whoosh" class="whoosh-burst" hidden>WHOOSH</div>
    </div>

    <button id="talk" class="talk" type="button" hidden>TALK</button>
    <button id="mapbtn" class="mapbtn" type="button" hidden>MAP · WALK</button>
    <div id="choices" class="choices" hidden></div>
    <button id="wake" class="wake" type="button"><span>Tap to listen</span></button>
  </main>
  <script src="play.js"></script>
</body>
</html>
