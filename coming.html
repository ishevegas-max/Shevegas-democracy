<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#ff6b3d" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="SheVegas" />
  <title>SheVegas</title>
  <link rel="manifest" href="coming.webmanifest" />
  <link rel="apple-touch-icon" href="art/splash.png" />
  <link rel="stylesheet" href="coming.css" />
</head>
<body>
  <main id="stage">
    <picture>
      <source media="(orientation: landscape)" srcset="art/splash-full.png" />
      <img class="bleed" src="art/splash.png" alt="SheVegas" />
    </picture>
    <div class="veil" aria-hidden="true"></div>
    <!-- Place stills drop in stills/ — mapped in coming.js LINES[].still. Hidden until a file exists. -->
    <img id="still" class="still" alt="" hidden />
    <p id="line" class="line slam tone-id">SHEVEGAS</p>
    <button id="wake" class="wake" type="button"><span>TAP · SOUND</span></button>
  </main>
  <script src="coming.js"></script>
</body>
</html>
